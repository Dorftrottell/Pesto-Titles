appId: com.pesto-captions
productName: Pesto Captions
copyright: Copyright © 2024 Pesto Captions Contributors
license: AGPL-3.0

directories:
  output: dist
  buildResources: resources

files:
  - dist-electron/**/*
  - out/**/*
  - src/bridge/**/*
  - package.json

extraResources:
  - from: src/bridge
    to: bridge

mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: resources/icon.icns

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
